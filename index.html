<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tempest" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>Tempest</title>
  </head>
  <body>
    <div id="map" aria-label="Map"></div>

    <header class="topbar" aria-label="Layer and model">
      <div class="topbar-main">
        <button class="layer-title" id="layer-button" aria-haspopup="dialog" aria-expanded="false">
          <span class="layer-name-row"><span class="layer-name" id="layer-name">Precipitation</span><span class="layer-chevron" data-icon="chevron"></span></span>
          <span class="run-age" id="run-age">Finding the latest run…</span>
        </button>
        <div class="model-pill" id="model-pill" aria-label="Model">HRDPS</div>
      </div>
    </header>

    <div class="thumbs">
      <button class="thumb" id="locate" aria-label="Go to my location" data-icon="locate"></button>
      <button class="thumb" id="map-layers" aria-label="Map layers" data-icon="layers" aria-haspopup="dialog" aria-expanded="false"></button>
    </div>

    <section class="sheet" id="sheet" aria-label="Details for the pin" data-state="collapsed">
      <button class="sheet-handle" id="sheet-handle" aria-label="Pull up for details"><span></span></button>
      <div class="sheet-scroll" id="sheet-scroll">
        <div class="sheet-scrubber">
          <div class="time-row">
            <div class="time-col">
              <span class="time-line"><span class="time" id="cursor-time"></span><span class="time-note" id="cursor-note"></span></span>
              <button class="place" id="place-line" aria-label="Centre the map on the pin"><span data-icon="pin-small"></span><span id="place-text">Finding your location…</span></button>
            </div>
            <div class="time-controls">
              <button class="pill-button" id="now-button">Now</button>
              <button class="round-button" id="play-button" aria-label="Play through time" data-icon="play"></button>
            </div>
          </div>
          <div class="window-row">
            <button class="window-button" id="window-button" aria-haspopup="dialog" aria-expanded="false"><span id="window-label">48 h</span><span data-icon="chevron"></span></button>
            <div class="window-summary" id="window-summary">
              <div class="summary-half"><span class="summary-main" id="summary-before"></span><span class="summary-sub" id="summary-before-label"></span></div>
              <div class="summary-half"><span class="summary-main" id="summary-after"></span><span class="summary-sub" id="summary-after-label"></span></div>
            </div>
          </div>
          <div class="chart-block">
            <div class="chart" id="chart" aria-label="The layer’s chart across the window. Drag to move through time.">
              <canvas id="chart-canvas"></canvas>
              <div class="chart-now" id="chart-now"></div>
              <div class="chart-needle"></div>
              <div class="chart-status" id="chart-status"></div>
            </div>
            <div class="chart-axis" id="chart-axis"></div>
          </div>
          <div class="week" id="week">
            <div class="week-days" id="week-days"></div>
            <div class="week-track" id="week-track">
              <div class="week-model" id="week-model"></div>
              <span class="week-beyond" id="week-beyond">Beyond model</span>
              <div class="week-dividers" id="week-dividers"></div>
            </div>
            <div class="week-now" id="week-now"></div>
            <div class="week-box" id="week-box" aria-label="Window on the week"></div>
          </div>
          <div class="legend-row" id="legend-row"></div>
        </div>
        <div class="details">
          <div class="subject" id="subject"><span class="subject-place" id="subject-place"></span><span class="subject-time" id="subject-time"></span></div>
        </div>
      </div>
    </section>

    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
