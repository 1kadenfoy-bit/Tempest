name: Publish to GitHub Pages

# Publishes main, the app, at the site's address, and the most recently pushed
# chat branches (claude/<name>) as previews at preview/<name>/, for Kaden to
# try on his phone (docs/working.md). Runs on every push to main or a chat
# branch. Skips while the repository is private.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs: build and upload, then publish. In one job, the publish step
# looked for the upload a second after it finished and, from Nov 21 08:06,
# kept finding nothing ("Found 0 artifacts"). GitHub's own Pages workflow
# publishes in a separate job that starts once the upload is complete.
jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: public/tiles
          key: basemap-all-${{ hashFiles('tools/regions.json', 'tools/build-basemap.mjs', 'tools/lib/*.mjs') }}-${{ steps.week.outputs.week }}
      - name: Base map for all of BC (about 680 MB in 28 files)
        run: npm run tiles:all
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Previews: the six chat branches (claude/...) pushed most recently, in the
      # last 3 days, each at preview/<name>/ (the branch name without "claude/").
      # One chat per round of changes (docs/working.md), so the names change.
      - name: Previews of recent chat branches
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          git fetch --quiet --depth=1 origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' || true
          since=$(date -u -d '3 days ago' +%s)
          git for-each-ref --sort=-committerdate --format='%(committerdate:unix) %(refname:strip=4)' 'refs/remotes/origin/claude/' \
            | awk -v s="$since" '$1 >= s { print $2 }' | head -6 > ../preview-branches.txt
          while read -r b; do
            n=$(echo "$b" | tr '/' '-')
            rm -rf "../wt-$n"
            git worktree add --detach "../wt-$n" "origin/claude/$b"
            if cmp -s package-lock.json "../wt-$n/package-lock.json"; then ln -s "$PWD/node_modules" "../wt-$n/node_modules"; else (cd "../wt-$n" && npm ci --no-audit --no-fund); fi
            # The base map and the satellite come from the main site, so a preview is small
            # (seven copies of the satellite would pass the site's 1 GB limit).
            if (cd "../wt-$n" && BASE_PATH="/$REPO/preview/$n/" VITE_TILES_BASE="/$REPO/tiles/" VITE_SATELLITE_BASE="/$REPO/satellite/" VITE_PREVIEW="$n" npx vite build); then
              mkdir -p "dist/preview/$n" && cp -r "../wt-$n/dist/." "dist/preview/$n/"
              rm -rf "dist/preview/$n/satellite"
            else
              echo "::warning::the $n preview did not build"
            fi
          done < ../preview-branches.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
