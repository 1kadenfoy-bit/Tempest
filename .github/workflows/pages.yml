name: Publish to GitHub Pages

# Publishes main, the combined app, at the site's address, and each section
# chat's branch (claude/tempest-<section>) as a preview at preview/<section>/,
# for Kaden to try on his phone (docs/sections/README.md). Runs on every push
# to main or a section branch. Skips while the repository is private.
on:
  push:
    branches: [main, 'claude/tempest-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs: build and upload, then publish. In one job, the publish step
# looked for the upload a second after it finished and, from Nov 21 08:06,
# kept finding nothing ("Found 0 artifacts"). GitHub's own Pages workflow
# publishes in a separate job that starts once the upload is complete.
jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: public/tiles
          key: basemap-all-${{ hashFiles('tools/regions.json', 'tools/build-basemap.mjs', 'tools/lib/*.mjs') }}-${{ steps.week.outputs.week }}
      - name: Base map for all of BC (about 680 MB in 28 files)
        run: npm run tiles:all
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Section previews (each section chat's branch, at preview/<section>/)
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          for s in maps interface weather effects data; do
            b="claude/tempest-$s"
            git fetch --depth=1 origin "$b" 2>/dev/null || { echo "no branch $b yet"; continue; }
            rm -rf "../wt-$s"
            git worktree add --detach "../wt-$s" FETCH_HEAD
            if cmp -s package-lock.json "../wt-$s/package-lock.json"; then ln -s "$PWD/node_modules" "../wt-$s/node_modules"; else (cd "../wt-$s" && npm ci --no-audit --no-fund); fi
            # The base map comes from the main site, so a preview is small.
            if (cd "../wt-$s" && BASE_PATH="/$REPO/preview/$s/" VITE_TILES_BASE="/$REPO/tiles/" VITE_PREVIEW="$s" npx vite build); then
              mkdir -p "dist/preview/$s" && cp -r "../wt-$s/dist/." "dist/preview/$s/"
              # The satellite picture (62 MB) is read from the main site, like
              # the base map: seven copies would pass the site's 1 GB limit.
              rm -rf "dist/preview/$s/satellite"
            else
              echo "::warning::the $s preview did not build"
            fi
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
