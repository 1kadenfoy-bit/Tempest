name: CI

# Once per change: pull requests, and pushes to main. A push to a branch with
# an open pull request used to start two identical runs at once, and together
# they used up Open-Meteo's free per-minute and hourly limits (tests then
# timed out waiting for the forecast).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The browser tests are split across four machines that run at the same
  # time, one test at a time on each: the map draws in software on these
  # machines, and two tests sharing one machine starved each other (the
  # Nov 21 run hit the time limit). Every test still runs, unchanged.
  # tools/test-plan.mjs gives each machine an even share by measured time
  # (e2e/durations.json), and the tests most likely to fail first (Kaden,
  # Nov 27): last run's failures, then the areas this branch changed.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: check (${{ matrix.shard }} of 4)
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history to see what this branch changed since main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The quick checks first, on every machine (under a minute): a typing or
      # lint mistake stops the run before any browser starts.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

      - name: Unit tests
        if: matrix.shard == 1
        run: npm test

      # The base map is cut from the Protomaps daily build. Keep it for a week
      # so CI does not download it on every push. CI builds only the pieces
      # the tests use (npm run tiles, run before build).
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: public/tiles
          key: basemap-ci-${{ hashFiles('tools/regions.json', 'tools/build-basemap.mjs', 'tools/lib/*.mjs') }}-${{ steps.week.outputs.week }}

      - name: Build
        run: npm run build

      # The browser is kept between runs (about 110 MB); only the system
      # libraries it needs are installed each time.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - name: Install browser for screenshot tests
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Failed tests first (Kaden, Nov 26): every machine keeps the list of
      # tests that failed on its last run of this branch; each machine reads
      # all four lists, since a test can move to another machine when the
      # shares are rebalanced.
      - name: Failures from this branch's last run (machine 1)
        uses: actions/cache/restore@v6
        with:
          path: .last-run/1
          key: last-run-${{ github.head_ref || github.ref_name }}-1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-run-${{ github.head_ref || github.ref_name }}-1-
      - name: Failures from this branch's last run (machine 2)
        uses: actions/cache/restore@v6
        with:
          path: .last-run/2
          key: last-run-${{ github.head_ref || github.ref_name }}-2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-run-${{ github.head_ref || github.ref_name }}-2-
      - name: Failures from this branch's last run (machine 3)
        uses: actions/cache/restore@v6
        with:
          path: .last-run/3
          key: last-run-${{ github.head_ref || github.ref_name }}-3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-run-${{ github.head_ref || github.ref_name }}-3-
      - name: Failures from this branch's last run (machine 4)
        uses: actions/cache/restore@v6
        with:
          path: .last-run/4
          key: last-run-${{ github.head_ref || github.ref_name }}-4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-run-${{ github.head_ref || github.ref_name }}-4-

      - name: This machine's tests, most likely to fail first
        id: plan
        run: |
          node tools/test-plan.mjs --shard=${{ matrix.shard }}/4 --write-failed=.last-run/all.json
          node tools/test-plan.mjs --shard=${{ matrix.shard }}/4 --github >> "$GITHUB_OUTPUT"

      # Each step stops the machine when a test fails, so a failure shows in
      # minutes; the steps after it are skipped. Each keeps its own results
      # folder (a new run of the tests empties its folder).
      - name: 1. Last run's failed tests
        if: steps.plan.outputs.failed != ''
        run: npx playwright test --trace off --workers=1 --last-failed --last-failed-file=.last-run/all.json --pass-with-no-tests --output=test-results/1-failed ${{ steps.plan.outputs.failed }}

      - name: 2. Tests of the areas this branch changed
        if: steps.plan.outputs.changed != ''
        run: npx playwright test --trace off --workers=1 --output=test-results/2-changed ${{ steps.plan.outputs.changed }}

      - name: 3. The rest of this machine's tests (390 x 844)
        if: steps.plan.outputs.rest != ''
        run: npx playwright test --trace off --workers=1 --output=test-results/3-rest ${{ steps.plan.outputs.rest }}

      - name: Remember this run's failed tests
        if: always()
        run: |
          mkdir -p .last-run/${{ matrix.shard }}
          node -e "
            const fs = require('fs');
            const ids = ['1-failed', '2-changed', '3-rest'].flatMap((d) => { try { return JSON.parse(fs.readFileSync('test-results/' + d + '/.last-run.json', 'utf8')).failedTests; } catch { return []; } });
            fs.writeFileSync('.last-run/${{ matrix.shard }}/last-run.json', JSON.stringify({ status: ids.length ? 'failed' : 'passed', failedTests: ids }));
          "

      - name: Keep the list for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .last-run/${{ matrix.shard }}
          key: last-run-${{ github.head_ref || github.ref_name }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Where pixel tests differ
        if: failure()
        run: node tools/diff-report.mjs

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
