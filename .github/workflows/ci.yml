name: CI

# Once per change: pull requests, and pushes to main. A push to a branch with
# an open pull request used to start two identical runs at once, and together
# they used up Open-Meteo's free per-minute and hourly limits (tests then
# timed out waiting for the forecast).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The browser tests are split across three machines that run at the same
  # time, one test at a time on each: the map draws in software on these
  # machines, and two tests sharing one machine starved each other (the
  # Nov 21 run hit the time limit). Every test still runs, unchanged.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: check (${{ matrix.shard }} of 3)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

      - name: Unit tests
        if: matrix.shard == 1
        run: npm test

      # The base map is cut from the Protomaps daily build. Keep it for a week
      # so CI does not download it on every push. CI builds only the pieces
      # the tests use (npm run tiles, run before build).
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: public/tiles
          key: basemap-ci-${{ hashFiles('tools/regions.json', 'tools/build-basemap.mjs', 'tools/lib/*.mjs') }}-${{ steps.week.outputs.week }}

      - name: Build
        run: npm run build

      - name: Install browser for screenshot tests
        run: npx playwright install --with-deps chromium

      # Failed tests first (Kaden, Nov 26): each machine keeps the list of
      # tests that failed on its last run of this branch and runs those
      # before anything else. If they still fail, the run stops in minutes
      # instead of after the whole set; if they pass, the whole set runs.
      - name: Failures from this branch's last run
        uses: actions/cache/restore@v6
        with:
          path: .last-run
          key: last-run-${{ github.head_ref || github.ref_name }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: last-run-${{ github.head_ref || github.ref_name }}-${{ matrix.shard }}-

      - name: Last run's failed tests, first
        if: hashFiles('.last-run/last-run.json') != ''
        run: npx playwright test --trace off --workers=1 --last-failed --last-failed-file=.last-run/last-run.json --pass-with-no-tests

      - name: Screenshot tests (390 x 844)
        run: npm run screenshots -- --shard=${{ matrix.shard }}/3 --workers=1

      - name: Remember this run's failed tests
        if: always() && hashFiles('test-results/.last-run.json') != ''
        run: mkdir -p .last-run && cp test-results/.last-run.json .last-run/last-run.json

      - name: Keep the list for the next run
        if: always() && hashFiles('.last-run/last-run.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .last-run
          key: last-run-${{ github.head_ref || github.ref_name }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Where pixel tests differ
        if: failure()
        run: node tools/diff-report.mjs

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
